# This is an example .goreleaser.yml file with some sensible defaults.
# Make sure to check the documentation at https://goreleaser.com

# The lines below are called `modelines`. See `:help modeline`
# Feel free to remove those if you don't want/need to use them.
# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
# vim: set ts=2 sw=2 tw=0 fo=cnqoj

version: 2

env:
  - GO111MODULE=on

before:
  hooks:
    # You may remove this if you don't use go modules.
    - go mod tidy

gomod:
  proxy: true
  env:
    - GOPROXY=https://goproxy.cn,direct

report_sizes: true

builds:
  - main: ./cmd/milady
    binary: milady
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - arm64
      - amd64
    flags:
      - -trimpath
    ldflags:
      - -s -w 
      - -X {{.ModulePath}}/pkg/version.gitVersion={{.Version}}
      - -X {{.ModulePath}}/pkg/version.gitCommit={{.Commit}} 
      - -X {{.ModulePath}}/pkg/version.buildTime={{ .CommitDate }} 
      - -X {{.ModulePath}}/pkg/version.builtBy=kalandramo 
      - -X {{.ModulePath}}/pkg/version.gitTreeState={{ .IsGitDirty }}

archives:
  - formats: [tar.gz]
    # this name template makes the OS and Arch compatible with the results of `uname`.
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    # use zip for windows archives
    format_overrides:
      - goos: windows
        formats: [zip]

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

release:
  footer: >-

    ---

    Released by [GoReleaser](https://github.com/goreleaser/goreleaser).
