name: Release

on:
  push:
    tags:
      - 'v*' # 推送v开头tag触发正式发布
  # 可选：支持手动触发
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # ⚠️必须0，goreleaser需要完整git历史获取commit、dirty状态

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26' # 和你项目Go版本保持一致
          cache: true

      - name: Install GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: ~>2.0
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 如果后续需要自定义环境变量可以在这里追加